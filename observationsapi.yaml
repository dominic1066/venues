  /external/busAustraliaSearch:
    get:
      summary: Search Bus Australia fleet data
      description: Searches the Bus Australia fleet database for vehicle information by vehicle ID
      parameters:
        - name: cityId
          in: query
          description: City ID (integer) - required
          required: true
          schema:
            type: integer
        - name: vehicleId
          in: query
          description: Vehicle ID to search for (string, max 10 chars) - required
          required: true
          schema:
            type: string
            maxLength: 10
      responses:
        '200':
          description: Search results from Bus Australia
          content:
            application/json:
              schema:
                type: object
                properties:
                  vehicleId:
                    type: string
                    description: The searched vehicle ID
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        registration:
                          type: string
                          description: Vehicle registration number
                        chassis:
                          type: string
                          description: Chassis type information
                        seatingCodes:
                          type: string
                          description: Seating configuration codes
                        operator:
                          type: string
                          description: Operating company name
                example:
                  vehicleId: "V123"
                  results: [
                    {
                      "registration": "ABC123",
                      "chassis": "Mercedes Citaro",
                      "seatingCodes": "D47/28SD",
                      "operator": "TransDev"
                    }
                  ]
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"vehicleId" is required'
        '500':
          description: External service error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Timeout or network error'
