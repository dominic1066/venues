openapi: 3.0.3
info:
  title: ObservationsNode API (venue / observations / transit / gtfs)
  version: 1.0.0
  description: API surface exposed by routes/venue.js, routes/observations.js, routes/transit.js, and routes/gtfs.js
servers:
  - url: http://localhost:3000
paths:
  /venue/GetVenuesToMonitor:
    get:
      summary: Get venues to monitor
      description: Returns a list of venues that should be monitored. No parameters.
      responses:
        '200':
          description: JSON array of venues encoded as text/plain
          content:
            text/plain:
              schema:
                type: string
                example: '{"venues":[{"id":1,"name":"Venue A"},{"id":2,"name":"Venue B"}]}'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /venue/GetVenues:
    get:
      summary: Get venues (optionally by city)
      parameters:
        - name: city
          in: query
          description: Optional city filter (string)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: venues array wrapped in object (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"venues":[{"id":1,"name":"Venue A","city":"Seattle"}]}'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /venue/GetCities:
    get:
      summary: Get list of cities
      responses:
        '200':
          description: list of cities (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"venues":[{"city":"Seattle"},{"city":"Portland"}]}'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
  /venue/GetVenueGroups:
    get:
      summary: Get venue groups
      responses:
        '200':
          description: venue groups (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"venueGroups":[{"id":1,"name":"Group A"}]}'
        '500':
          description: Database error
  /venue/GetVenuesByGroup:
    get:
      summary: Get venues by group
      parameters:
        - name: groupId
          in: query
          description: Group id (integer) - required
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: venues belonging to group (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"venues":[{"id":3,"name":"Venue C","groupId":1}]}'
        '400':
          description: Missing groupId parameter
          content:
            text/plain:
              schema:
                type: string
                example: 'Missing groupId parameter'
        '500':
          description: Database error
  /observations/GetOccupancyByVenue:
    get:
      summary: Get occupancy/observations for a venue
      parameters:
        - name: venueId
          in: query
          description: Venue id (integer) - required
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: observation records for the venue (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"observations":[{"timestamp":"2025-11-09T12:00:00Z","count":42}]}'
        '400':
          description: Missing venueId parameter
          content:
            text/plain:
              schema:
                type: string
                example: 'Missing venueId parameter'
        '500':
          description: Database error
  /observations/GetOccupancyByVenueGroup:
    get:
      summary: Get occupancy for a venue group
      parameters:
        - name: venueGroupId
          in: query
          description: Venue group id (integer) - required
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: observations aggregated by venue group (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"observations":[{"venueId":1,"timestamp":"2025-11-09T12:00:00Z","count":42}]}'
        '400':
          description: Missing venueGroupId parameter
          content:
            text/plain:
              schema:
                type: string
                example: 'Missing venueGroupId parameter'
        '500':
          description: Database error
  /transit/GetTransitTypes:
    get:
      summary: Get transit types
      description: Returns a list of available transit route types
      responses:
        '200':
          description: JSON array of transit types encoded as text/plain
          content:
            text/plain:
              schema:
                type: string
                example: '{"types":[{"id":0,"name":"Tram"},{"id":1,"name":"Subway"}]}'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetTransitRoutes:
    get:
      summary: Get transit routes
      description: Returns a list of all transit routes
      responses:
        '200':
          description: JSON array of transit routes encoded as text/plain
          content:
            text/plain:
              schema:
                type: string
                example: '{"routes":[{"routeId":"R1","cityId":1,"shortName":"1","longName":"Downtown Loop"}]}'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetTransitCities:
    get:
      summary: Get transit cities
      description: Returns a list of cities that have transit data
      responses:
        '200':
          description: JSON array of cities encoded as text/plain
          content:
            text/plain:
              schema:
                type: string
                example: '{"cities":[{"id":1,"name":"Seattle"},{"id":2,"name":"Portland"}]}'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetRoutesToMonitor:
    get:
      summary: Get routes to monitor
      description: Returns a list of transit routes that are being monitored
      responses:
        '200':
          description: JSON array of monitored routes encoded as text/plain
          content:
            text/plain:
              schema:
                type: string
                example: '{"routes":[{"id":1,"routeId":"R1","cityId":1,"shortName":"1"}]}'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetLiveTrips:
    get:
      summary: Get live trips for a city
      description: Returns live transit trips for a specific city
      parameters:
        - name: cityId
          in: query
          description: City ID (integer) - required
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Live trip observations (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"observations":[{"tripId":"123","routeId":"1","lat":47.6,"lon":-122.3}]}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"cityId" is required'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetShapeForTrip:
    get:
      summary: Get shape data for a specific trip
      description: Returns the geographic shape/path for a transit trip
      parameters:
        - name: cityId
          in: query
          description: City ID (integer) - required
          required: true
          schema:
            type: integer
        - name: tripId
          in: query
          description: Trip ID (string) - required
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trip shape data (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"shape":[{"lat":47.6,"lon":-122.3,"sequence":1}]}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"tripId" is required'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetObservationsForTrip:
    get:
      summary: Get observations for a specific trip
      description: Returns all recorded observations for a transit trip
      parameters:
        - name: cityId
          in: query
          description: City ID (integer) - required
          required: true
          schema:
            type: integer
        - name: tripId
          in: query
          description: Trip ID (string) - required
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trip observations (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"shape":[{"lat":47.6,"lon":-122.3,"timestamp":"2025-12-07T10:30:00Z"}]}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"tripId" is required'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/SubmitRoute:
    post:
      summary: Submit a new transit route
      description: Creates or updates a transit route with validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteSubmission'
      responses:
        '200':
          description: Route successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "routeId is required"
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/SubmitCalendar:
    post:
      summary: Submit a service calendar
      description: Creates or updates a service calendar that defines which days a transit service operates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarSubmission'
      responses:
        '200':
          description: Calendar successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "serviceId is required"
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/MonitorRoute:
    post:
      summary: Monitor a transit route
      description: Adds a route to the monitoring list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorRouteRequest'
      responses:
        '200':
          description: Route successfully added to monitoring
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "id is required"
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/UnmonitorRoute:
    post:
      summary: Unmonitor a transit route
      description: Removes a route from the monitoring list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorRouteRequest'
      responses:
        '200':
          description: Route successfully removed from monitoring
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "id is required"
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /gtfs/SubmitAgency:
    post:
      summary: Submit GTFS agency data
      description: Creates or updates a transit agency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GTFSAgency'
      responses:
        '200':
          description: Agency successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /gtfs/SubmitStop:
    post:
      summary: Submit GTFS stop data
      description: Creates or updates a transit stop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GTFSStop'
      responses:
        '200':
          description: Stop successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /gtfs/SubmitTrip:
    post:
      summary: Submit GTFS trip data
      description: Creates or updates a transit trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GTFSTrip'
      responses:
        '200':
          description: Trip successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /gtfs/SubmitStopTime:
    post:
      summary: Submit GTFS stop time data
      description: Creates or updates a stop time for a trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GTFSStopTime'
      responses:
        '200':
          description: Stop time successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /gtfs/SubmitShape:
    post:
      summary: Submit GTFS shape data
      description: Creates or updates a shape point for a route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GTFSShape'
      responses:
        '200':
          description: Shape successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /gtfs/SubmitCalendarDate:
    post:
      summary: Submit GTFS calendar date data
      description: Creates or updates calendar exceptions (dates when service differs from normal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GTFSCalendarDate'
      responses:
        '200':
          description: Calendar date successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /gtfs/SubmitFareAttribute:
    post:
      summary: Submit GTFS fare attribute data
      description: Creates or updates fare information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GTFSFareAttribute'
      responses:
        '200':
          description: Fare attribute successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /gtfs/SubmitFareRule:
    post:
      summary: Submit GTFS fare rule data
      description: Creates or updates fare rules (how fares apply to routes/zones)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GTFSFareRule'
      responses:
        '200':
          description: Fare rule successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /gtfs/SubmitFeedInfo:
    post:
      summary: Submit GTFS feed info data
      description: Creates or updates feed metadata information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GTFSFeedInfo'
      responses:
        '200':
          description: Feed info successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /gtfs/SubmitFrequency:
    post:
      summary: Submit GTFS frequency data
      description: Creates or updates headway-based service (frequency of service)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GTFSFrequency'
      responses:
        '200':
          description: Frequency successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /gtfs/SubmitPathway:
    post:
      summary: Submit GTFS pathway data
      description: Creates or updates pathways linking locations within stations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GTFSPathway'
      responses:
        '200':
          description: Pathway successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /gtfs/SubmitTransfer:
    post:
      summary: Submit GTFS transfer data
      description: Creates or updates transfer rules between stops
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GTFSTransfer'
      responses:
        '200':
          description: Transfer successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /gtfs/SubmitTranslation:
    post:
      summary: Submit GTFS translation data
      description: Creates or updates translations for GTFS fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GTFSTranslation'
      responses:
        '200':
          description: Translation successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
components:
  schemas:
    Venue:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: string
    VenueGroup:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    Observation:
      type: object
      properties:
        venueId:
          type: integer
        timestamp:
          type: string
          format: date-time
        count:
          type: integer
    RouteSubmission:
      type: object
      required:
        - routeId
        - cityId
        - shortName
      properties:
        routeId:
          type: string
          description: Unique identifier for the route
        cityId:
          type: integer
          description: ID of the city this route belongs to
        shortName:
          type: string
          description: Short name/code for the route
        longName:
          type: string
          description: Long descriptive name for the route
        routeType:
          type: integer
          description: Type of transit route
        agencyId:
          type: string
          description: ID of the transit agency
    CalendarSubmission:
      type: object
      required:
        - serviceId
        - cityId
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
        - saturday
        - sunday
        - startDate
        - endDate
      properties:
        serviceId:
          type: string
          description: Unique identifier for the service calendar
        cityId:
          type: integer
          description: ID of the city this calendar belongs to
        monday:
          type: boolean
          description: Service operates on Mondays
        tuesday:
          type: boolean
          description: Service operates on Tuesdays
        wednesday:
          type: boolean
          description: Service operates on Wednesdays
        thursday:
          type: boolean
          description: Service operates on Thursdays
        friday:
          type: boolean
          description: Service operates on Fridays
        saturday:
          type: boolean
          description: Service operates on Saturdays
        sunday:
          type: boolean
          description: Service operates on Sundays
        startDate:
          type: string
          format: date
          description: Start date of service (YYYY-MM-DD)
        endDate:
          type: string
          format: date
          description: End date of service (YYYY-MM-DD)
    MonitorRouteRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          description: Database ID of the route to monitor/unmonitor
    GTFSAgency:
      type: object
      required:
        - cityId
        - agencyId
        - agencyName
        - agencyUrl
        - agencyTimezone
      properties:
        cityId:
          type: integer
          description: ID of the city this agency belongs to
        agencyId:
          type: string
