components:
  schemas:
    Venue:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: string
    VenueGroup:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    Observation:
      type: object
      properties:
        venueId:
          type: integer
        timestamp:
          type: string
          format: date-time
        count:
          type: integer
    RouteSubmission:
      type: object
      required:
        - routeId
        - cityId
        - shortName
      properties:
        routeId:
          type: string
          description: Unique identifier for the route
        cityId:
          type: integer
          description: ID of the city this route belongs to
        shortName:
          type: string
          description: Short name/code for the route
        longName:
          type: string
          description: Long descriptive name for the route
        routeType:
          type: integer
          description: Type of transit route
        agencyId:
          type: string
          description: ID of the transit agency
    CalendarSubmission:
      type: object
      required:
        - serviceId
        - cityId
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
        - saturday
        - sunday
        - startDate
        - endDate
      properties:
        serviceId:
          type: string
          description: Unique identifier for the service calendar
        cityId:
          type: integer
          description: ID of the city this calendar belongs to
        monday:
          type: boolean
          description: Service operates on Mondays
        tuesday:
          type: boolean
          description: Service operates on Tuesdays
        wednesday:
          type: boolean
          description: Service operates on Wednesdays
        thursday:
          type: boolean
          description: Service operates on Thursdays
        friday:
          type: boolean
          description: Service operates on Fridays
        saturday:
          type: boolean
          description: Service operates on Saturdays
        sunday:
          type: boolean
          description: Service operates on Sundays
        startDate:
          type: string
          format: date
          description: Start date of service (YYYY-MM-DD)
        endDate:
          type: string
          format: date
          description: End date of service (YYYY-MM-DD)
    MonitorRouteRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          description: Database ID of the route to monitor/unmonitor
    BulkTransitObservationItem:
      type: object
      description: A single transit observation item used in the SubmitBulkTransitObservations array body
      required:
        - tripId
        - cityId
        - long
        - lat
        - bearing
        - routeId
        - directionId
        - startDate
        - vehicleId
        - occupancyStatus
        - timestamp
      properties:
        tripId:
          type: string
          maxLength: 100
          description: Unique identifier for the trip
        cityId:
          type: integer
          description: ID of the city
        shapeId:
          type: string
          maxLength: 100
          nullable: true
          description: Identifier for the shape/path
        serviceId:
          type: string
          maxLength: 100
          nullable: true
          description: Service calendar identifier
        long:
          type: number
          format: float
          description: Longitude coordinate
        lat:
          type: number
          format: float
          description: Latitude coordinate
        bearing:
          type: number
          format: float
          description: Vehicle bearing/heading in degrees
        routeId:
          type: string
          maxLength: 100
          description: Route identifier
        directionId:
          type: integer
          description: Direction of travel (0 or 1)
        startDate:
          type: string
          format: date
          description: Service start date
        vehicleId:
          type: string
          maxLength: 10
          description: Vehicle identifier
        occupancyStatus:
          type: integer
          description: Occupancy status code
        timestamp:
          type: integer
          description: Unix timestamp of the observation
        headsign:
          type: string
          maxLength: 200
          nullable: true
          description: Destination headsign displayed on the vehicle
    TransitObservation:
      type: object
      required:
        - tripId
        - cityId
        - shapeId
        - serviceId
        - long
        - lat
