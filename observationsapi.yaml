  /transit/SubmitBulkTransitObservations:
    post:
      summary: Submit multiple transit observations in a single call
      description: |
        Accepts an array of transit vehicle observations and inserts them all via the
        InsertTransitObservations stored procedure using a user-defined table type
        (TransitObservationType). At least one item is required. Each item follows
        the same shape as SubmitTransitObservation with the addition of an optional
        headsign field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/BulkTransitObservationItem'
      responses:
        '200':
          description: All observations successfully inserted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
