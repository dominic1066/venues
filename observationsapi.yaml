openapi: 3.0.3
info:
  title: ObservationsNode API (venue / observations / transit / gtfs)
  version: 1.0.0
  description: API surface exposed by routes/venue.js, routes/observations.js, routes/transit.js, and routes/gtfs.js
servers:
  - url: http://localhost:3000
paths:
  /venue/GetVenuesToMonitor:
    get:
      summary: Get venues to monitor
      description: Returns a list of venues that should be monitored. No parameters.
      responses:
        '200':
          description: JSON array of venues encoded as text/plain
          content:
            text/plain:
              schema:
                type: string
                example: '{"venues":[{"id":1,"name":"Venue A"},{"id":2,"name":"Venue B"}]}'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /venue/GetVenues:
    get:
      summary: Get venues (optionally by city)
      parameters:
        - name: city
          in: query
          description: Optional city filter (string)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: venues array wrapped in object (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"venues":[{"id":1,"name":"Venue A","city":"Seattle"}]}'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /venue/GetCities:
    get:
      summary: Get list of cities
      responses:
        '200':
          description: list of cities (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"venues":[{"city":"Seattle"},{"city":"Portland"}]}'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
  /venue/GetVenueGroups:
    get:
      summary: Get venue groups
      responses:
        '200':
          description: venue groups (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"venueGroups":[{"id":1,"name":"Group A"}]}'
        '500':
          description: Database error
  /venue/GetVenuesByGroup:
    get:
      summary: Get venues by group
      parameters:
        - name: groupId
          in: query
          description: Group id (integer) - required
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: venues belonging to group (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"venues":[{"id":3,"name":"Venue C","groupId":1}]}'
        '400':
          description: Missing groupId parameter
          content:
            text/plain:
              schema:
                type: string
                example: 'Missing groupId parameter'
        '500':
          description: Database error
  /venue/GetCityDistricts:
    get:
      summary: Get districts for a city
      parameters:
        - name: cityId
          in: query
          description: City ID to get districts for
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: list of districts for the city (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"districts":[{"id":1,"name":"Downtown","cityId":1},{"id":2,"name":"Uptown","cityId":1}]}'
        '400':
          description: Missing cityId parameter
          content:
            text/plain:
              schema:
                type: string
                example: 'Missing cityId parameter'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
  /observations/GetOccupancyByVenue:
    get:
      summary: Get occupancy/observations for a venue
      parameters:
        - name: venueId
          in: query
          description: Venue id (integer) - required
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: observation records for the venue (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"observations":[{"timestamp":"2025-11-09T12:00:00Z","count":42}]}'
        '400':
          description: Missing venueId parameter
          content:
            text/plain:
              schema:
                type: string
                example: 'Missing venueId parameter'
        '500':
          description: Database error
  /observations/GetOccupancyByVenueGroup:
    get:
      summary: Get occupancy for a venue group
      parameters:
        - name: venueGroupId
          in: query
          description: Venue group id (integer) - required
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: observations aggregated by venue group (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"observations":[{"venueId":1,"timestamp":"2025-11-09T12:00:00Z","count":42}]}'
        '400':
          description: Missing venueGroupId parameter
          content:
            text/plain:
              schema:
                type: string
                example: 'Missing venueGroupId parameter'
        '500':
          description: Database error
  /transit/GetTransitTypes:
    get:
      summary: Get transit types
      description: Returns a list of available transit route types
      responses:
        '200':
          description: JSON array of transit types encoded as text/plain
          content:
            text/plain:
              schema:
                type: string
                example: '{"types":[{"id":0,"name":"Tram"},{"id":1,"name":"Subway"}]}'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetTransitRoutes:
    get:
      summary: Get transit routes
      description: Returns a list of all transit routes
      responses:
        '200':
          description: JSON array of transit routes encoded as text/plain
          content:
            text/plain:
              schema:
                type: string
                example: '{"routes":[{"routeId":"R1","cityId":1,"shortName":"1","longName":"Downtown Loop"}]}'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetOccupancyTransitions:
    get:
      summary: Get occupancy transitions for a city
      description: Returns all occupancy increment/decrement events for transit trips in a specific city
      parameters:
        - name: cityId
          in: query
          description: City ID (integer) - required
          required: true
          schema:
            type: integer
        - name: tripDate
          in: query
          description: Trip date (YYYY-MM-DD) - optional filter for specific date
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Occupancy transition events (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"transitions":[{"CityId":1,"TripId":"1__0__781__TZM__102__2__102__2_20260125","TripDate":"2026-02-15T00:00:00.000Z","Increment":1,"Latitude":-41.2836838,"Longitude":174.7754822,"Timestamp":1771131788}]}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"cityId" is required'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetTripsForRoute:
    get:
      summary: Get trips for a specific route
      description: Returns all trips that belong to a specific transit route in a city
      parameters:
        - name: cityId
          in: query
          description: City ID (integer) - required
          required: true
          schema:
            type: integer
        - name: routeId
          in: query
          description: Route ID (string) - required
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trips for the specified route (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"trips":[{"tripId":"123","routeId":"1","serviceId":"weekday"}]}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"cityId" is required'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetTransitCities:
    get:
      summary: Get transit cities
      description: Returns a list of cities that have transit data
      responses:
        '200':
          description: JSON array of cities encoded as text/plain
          content:
            text/plain:
              schema:
                type: string
                example: '{"cities":[{"id":1,"name":"Seattle"},{"id":2,"name":"Portland"}]}'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetRoutesToMonitor:
    get:
      summary: Get routes to monitor
      description: Returns a list of transit routes that are being monitored
      responses:
        '200':
          description: JSON array of monitored routes encoded as text/plain
          content:
            text/plain:
              schema:
                type: string
                example: '{"routes":[{"id":1,"routeId":"R1","cityId":1,"shortName":"1"}]}'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetMonitoredRoutes:
    get:
      summary: Get monitored routes for a city
      description: Returns all transit routes that are currently being monitored in a specific city
      parameters:
        - name: cityId
          in: query
          description: City ID (integer) - required
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Monitored routes for the city (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"routes":[{"routeId":"1","cityId":1,"shortName":"Route 1"}]}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"cityId" is required'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetLiveTrips:
    get:
      summary: Get live trips for a city
      description: Returns live transit trips for a specific city
      parameters:
        - name: cityId
          in: query
          description: City ID (integer) - required
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Live trip observations (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"observations":[{"tripId":"123","routeId":"1","lat":47.6,"lon":-122.3}]}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"cityId" is required'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetMonitoredLiveTrips:
    get:
      summary: Get monitored live trips for a city
      description: Returns live transit trips for routes that are being monitored in a specific city
      parameters:
        - name: cityId
          in: query
          description: City ID (integer) - required
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Live trip observations for monitored routes (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"observations":[{"tripId":"123","routeId":"1","lat":47.6,"lon":-122.3}]}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"cityId" is required'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetMonitoredTripsForToday:
    get:
      summary: Get monitored trips for today
      description: Returns all monitored transit trips scheduled for today in a specific city
      parameters:
        - name: cityId
          in: query
          description: City ID (integer) - required
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Monitored trips for today (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"monitoredTrips":[{"tripId":"123","routeId":"1","startTime":"08:00:00"}]}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"cityId" is required'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetCityDistricts:
    get:
      summary: Get districts for a city
      description: Returns all districts/zones within a specific city for transit planning
      parameters:
        - name: cityId
          in: query
          description: City ID to get districts for - required
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of districts for the city (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"districts":[{"id":1,"name":"Downtown","cityId":1},{"id":2,"name":"Uptown","cityId":1}]}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"cityId" is required'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetMonitoredTripsForToday:
    get:
      summary: Get monitored trips for today
      description: Returns all monitored transit trips scheduled for today in a specific city
      parameters:
        - name: cityId
          in: query
          description: City ID (integer) - required
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Monitored trips for today (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"monitoredTrips":[{"tripId":"123","routeId":"1","startTime":"08:00:00"}]}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"cityId" is required'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetShapeForTrip:
    get:
      summary: Get shape data for a specific trip
      description: Returns the geographic shape/path for a transit trip
      parameters:
        - name: cityId
          in: query
          description: City ID (integer) - required
          required: true
          schema:
            type: integer
        - name: tripId
          in: query
          description: Trip ID (string) - required
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trip shape data (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"shape":[{"lat":47.6,"lon":-122.3,"sequence":1}]}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"tripId" is required'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetFinalStopForTrip:
    get:
      summary: Get final stop data for a specific trip
      description: Returns the final stop information for a transit trip
      parameters:
        - name: cityId
          in: query
          description: City ID (integer) - required
          required: true
          schema:
            type: integer
        - name: tripId
          in: query
          description: Trip ID (string) - required
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Final stop data (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"shape":[{"stopId":"123","stopName":"Final Station","lat":47.6,"lon":-122.3}]}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"tripId" is required'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetObservationsForTrip:
    get:
      summary: Get observations for a specific trip
      description: Returns all recorded observations for a transit trip
      parameters:
        - name: cityId
          in: query
          description: City ID (integer) - required
          required: true
          schema:
            type: integer
        - name: tripId
          in: query
          description: Trip ID (string) - required
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trip observations (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"shape":[{"lat":47.6,"lon":-122.3,"timestamp":"2025-12-07T10:30:00Z"}]}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"tripId" is required'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetRouteDistrictStats:
    get:
      summary: Get route statistics by district
      description: Returns statistical data for transit routes aggregated by district, with optional filtering
      parameters:
        - name: cityId
          in: query
          description: City ID (integer) - required
          required: true
          schema:
            type: integer
        - name: routeId
          in: query
          description: Route ID (string) - optional filter for specific route
          required: false
          schema:
            type: string
        - name: districtId
          in: query
          description: District ID (integer) - optional filter for specific district
          required: false
          schema:
            type: integer
        - name: tripDate
          in: query
          description: Trip date (YYYY-MM-DD) - optional filter for specific date
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Route district statistics (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"routeDistrictStats":[{"routeId":"1","districtId":1,"avgSpeed":25.5,"tripCount":42}]}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"cityId" is required'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetDistrictHourlySpeeds:
    get:
      summary: Get hourly speed data by district
      description: Returns hourly speed statistics for transit routes, grouped by route and hour, with separate inward and outward speed measurements
      parameters:
        - name: cityId
          in: query
          description: City ID (integer) - required
          required: true
          schema:
            type: integer
        - name: tripDate
          in: query
          description: Trip date (YYYY-MM-DD) - optional filter for specific date
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Hourly speed data by route and direction (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"speeds":[{"routeId":"10","inwardSpeed":20.31774484052533,"outwardSpeed":null,"theHour":5},{"routeId":"10","inwardSpeed":22.478571007371006,"outwardSpeed":26.232123271434215,"theHour":6}]}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"cityId" is required'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetCityVehicles:
    get:
      summary: Get vehicles for a city
      description: Returns all vehicles registered in a specific city
      parameters:
        - name: cityId
          in: query
          description: City ID (integer) - required
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: City vehicles (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"vehicles":[{"cityId":1,"vehicleId":"V123","passengersSeated":30,"passengersStanding":20,"passengersTotal":50,"make":"Mercedes","model":"Citaro","registration":"ABC123"}]}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"cityId" is required'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/GetUnmatchedVehicles:
    get:
      summary: Get unmatched vehicles for a city
      description: Returns all vehicles that have been observed in transit data but are not registered in the vehicle database for a specific city
      parameters:
        - name: cityId
          in: query
          description: City ID (integer) - required
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Unmatched vehicles (text/plain)
          content:
            text/plain:
              schema:
                type: string
                example: '{"unmatchedVehicles":[{"cityId":1,"vehicleId":"V999","observationCount":15,"lastSeen":"2026-03-28T10:30:00Z"}]}'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: '"cityId" is required'
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/SubmitRoute:
    post:
      summary: Submit a new transit route
      description: Creates or updates a transit route with validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteSubmission'
      responses:
        '200':
          description: Route successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "routeId is required"
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/SubmitCalendar:
    post:
      summary: Submit a service calendar
      description: Creates or updates a service calendar that defines which days a transit service operates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarSubmission'
      responses:
        '200':
          description: Calendar successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "serviceId is required"
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/MonitorRoute:
    post:
      summary: Monitor a transit route
      description: Adds a route to the monitoring list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorRouteRequest'
      responses:
        '200':
          description: Route successfully added to monitoring
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "id is required"
        '500':
          description: Database error
          content:
            text/plain:
              schema:
                type: string
                example: 'Database error: <message>'
  /transit/UnmonitorRoute:
    post:
      summary: Unmonitor a transit route
      description: Removes a route from the monitoring list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorRouteRequest'
      responses:
        '200':
          description: Route successfully removed from monitoring
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
